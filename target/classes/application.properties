# URL de connexion à ta base de données MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/bibliotheque?useSSL=false&serverTimezone=UTC

# Identifiants de connexion à ta base
spring.datasource.username=root
spring.datasource.password=

# Driver JDBC MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate : mise à jour automatique du schéma
spring.jpa.hibernate.ddl-auto=update

# Affiche les requêtes SQL dans la console (utile pour debug)
spring.jpa.show-sql=true

# Dialecte SQL spécifique à MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# spring.main.web-application-type=none
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
# spring.mvc.static-path-pattern=/resources/**
spring.web.resources.static-locations=classpath:/static/
